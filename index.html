<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChefBot AI Dashboard</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#fff7ed;
      display:flex;
      height:100vh;
      overflow:hidden;
    }

    /* Sidebar */
    .sidebar{
      width:240px;
      background:#9a3412;
      color:white;
      padding:25px;
    }

    .sidebar h2{
      margin-bottom:40px;
      font-size:24px;
    }

    .menu{
      list-style:none;
    }

    .menu li{
      padding:14px;
      margin-bottom:10px;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
    }

    .menu li:hover{
      background:#c2410c;
    }

    /* Main */
    .main{
      flex:1;
      padding:25px;
      overflow:auto;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .topbar h1{
      color:#9a3412;
    }

    .status{
      background:#22c55e;
      color:white;
      padding:8px 15px;
      border-radius:20px;
      font-size:14px;
    }

    /* Cards */
    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-bottom:25px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:16px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    .card h3{
      margin-bottom:10px;
      color:#c2410c;
    }

    .card p{
      font-size:28px;
      font-weight:bold;
      color:#9a3412;
    }

    /* Chat Section */
    .chat-section{
      background:white;
      border-radius:20px;
      padding:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    .chat-section h2{
      margin-bottom:15px;
      color:#9a3412;
    }

    iframe{
      width:100%;
      height:520px;
      border:none;
      border-radius:15px;
    }

    /* Footer */
    .footer{
      margin-top:20px;
      text-align:center;
      color:#6b7280;
      font-size:14px;
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>👨‍🍳 ChefBot AI</h2>

    <ul class="menu">
      <li>Dashboard</li>
      <li>Recipe Generator</li>
      <li>Meal Planner</li>
      <li>Nutrition Analysis</li>
      <li>Cooking Assistant</li>
      <li>Settings</li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <h1>ChefBot AI Dashboard</h1>
      <div class="status">ChefBot Online</div>
    </div>

    <!-- Stats Cards -->
    <div class="cards">

      <div class="card">
        <h3>Recipes Generated</h3>
        <p>2,450</p>
      </div>

      <div class="card">
        <h3>Meals Planned</h3>
        <p>1,120</p>
      </div>

      <div class="card">
        <h3>Active Users</h3>
        <p>530</p>
      </div>

      <div class="card">
        <h3>AI Accuracy</h3>
        <p>98%</p>
      </div>

    </div>

    <!-- Chatbot Section -->
    <div class="chat-section">
      <h2>🍳 ChefBot Cooking Assistant</h2>

      <!-- Replace with your chatbot URL -->
      <iframe
        src="https://cdn.botpress.cloud/webchat/v3.6/shareable.html?configUrl=https://files.bpcontent.cloud/2026/06/11/07/20260611072848-7OLI1DLR.json"
    </div>

    <div class="footer">
      ChefBot AI Dashboard © 2026 | Smart Recipe & Cooking Assistant
    </div>

  </div>

</body>
</html>
